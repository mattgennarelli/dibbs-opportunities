name: Nightly ingest

# Pulls the rolling 7-day window of DIBBS RFQ listings into Postgres. Runs every 3 hours so a
# transient failure in one run still gets caught up by the next within a few hours.
#
# Minute :17 (not :00) is deliberate -- GitHub Actions documents that schedules firing exactly
# on the hour see the highest load, and the resulting delay/drop rate, so every cron on this
# repo is offset off the top of the hour.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

# Only one ingest run at a time, repo-wide. A second run (whether the other schedule firing or
# a manual dispatch) queues behind the first rather than running concurrently against the same
# database rows.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - run: echo "Triggered by ${{ github.event_name }} (schedule=${{ github.event.schedule }})"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # No-op if migrations are already applied -- scripts/migrate.ts tracks applied migrations
      # itself and only runs the ones that are new.
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

      # No date argument -- defaults to the rolling 7-day window (see scripts/ingest.ts's
      # header comment), so a day a prior run missed still gets caught up automatically.
      - run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
